<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🧪 Taller AR.js - Realidad Aumentada con Marcadores</title>
    
    <!-- A-Frame y AR.js -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.0/aframe/build/aframe-ar.js"></script>
    
    <!-- Three.js para manipulaciones avanzadas -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Arial', sans-serif;
        }
        
        .ui-overlay {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 1000;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 15px;
            border-radius: 10px;
            max-width: 300px;
        }
        
        .instructions {
            font-size: 14px;
            line-height: 1.4;
        }
        
        .status {
            margin-top: 10px;
            padding: 8px;
            border-radius: 5px;
            text-align: center;
            font-weight: bold;
        }
        
        .status.detected {
            background: rgba(0, 255, 0, 0.3);
            color: #00ff00;
        }
        
        .status.searching {
            background: rgba(255, 165, 0, 0.3);
            color: #ffa500;
        }
        
        .controls {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            display: flex;
            gap: 10px;
        }
        
        .control-btn {
            background: rgba(0, 0, 0, 0.7);
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
        }
        
        .control-btn:hover {
            background: rgba(0, 0, 0, 0.9);
        }
    </style>
</head>
<body>
    <!-- Interfaz de usuario -->
    <div class="ui-overlay">
        <h3>🧪 AR.js - Realidad Aumentada</h3>
        <div class="instructions">
            <p><strong>Instrucciones:</strong></p>
            <ul>
                <li>Permite acceso a la cámara</li>
                <li>Muestra el marcador HIRO en tu pantalla</li>
                <li>Apunta la cámara al marcador</li>
                <li>¡Observa la magia de la realidad aumentada!</li>
            </ul>
        </div>
        <div id="status" class="status searching">
            🔍 Buscando marcador...
        </div>
    </div>
    
    <!-- Controles -->
    <div class="controls">
        <button class="control-btn" onclick="toggleAnimation()">🔄 Toggle Animación</button>
        <button class="control-btn" onclick="changeModel()">🎲 Cambiar Modelo</button>
        <button class="control-btn" onclick="playSound()">🔊 Sonido</button>
    </div>
    
    <!-- Escena AR -->
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
        
        <!-- Marcador HIRO (marcador estándar) -->
        <a-marker preset="hiro" 
                  id="hiro-marker"
                  emitevents="true"
                  cursor="rayOrigin: mouse"
                  raycaster="objects: .clickable">
            
            <!-- Modelo 3D principal -->
            <a-box id="main-model"
                   position="0 0.5 0" 
                   material="color: #ff6b6b; metalness: 0.8; roughness: 0.2"
                   scale="1 1 1"
                   animation="property: rotation; to: 0 360 0; loop: true; dur: 3000"
                   class="clickable"
                   sound="src: #hover-sound; on: click">
            </a-box>
            
            <!-- Esfera decorativa -->
            <a-sphere position="1 0.5 0" 
                      radius="0.3" 
                      material="color: #4ecdc4; metalness: 0.5; roughness: 0.3"
                      animation="property: position; to: 1 1 0; loop: true; dir: alternate; dur: 2000">
            </a-sphere>
            
            <!-- Texto 3D -->
            <a-text value="AR.js\nTaller" 
                    position="0 1.5 0" 
                    align="center" 
                    color="#ffffff"
                    font="kelsonsans"
                    scale="0.5 0.5 0.5">
            </a-text>
            
        </a-marker>
        
        <!-- Marcador personalizado (opcional) -->
        <a-marker preset="custom" 
                  type="pattern" 
                  url="markers/pattern-rojo.patt"
                  id="custom-marker"
                  emitevents="true"
                  visible="false">
            
            <a-entity gltf-model="models/robot.glb"
                      scale="0.5 0.5 0.5"
                      position="0 0 0"
                      animation="property: rotation; to: 0 360 0; loop: true; dur: 4000">
            </a-entity>
            
        </a-marker>
        
        <!-- Cámara -->
        <a-entity camera></a-entity>
        
        <!-- Sonidos -->
        <a-assets>
            <audio id="hover-sound" src="sounds/hover.mp3" preload="auto"></audio>
            <audio id="detection-sound" src="sounds/detection.mp3" preload="auto"></audio>
        </a-assets>
        
    </a-scene>
    
    <!-- Scripts personalizados -->
    <script>
        // Variables globales
        let currentModel = 0;
        let animationEnabled = true;
        const models = [
            { type: 'box', color: '#ff6b6b', scale: '1 1 1' },
            { type: 'sphere', color: '#4ecdc4', scale: '0.8 0.8 0.8' },
            { type: 'cylinder', color: '#45b7d1', scale: '0.8 1.2 0.8' },
            { type: 'torus', color: '#96ceb4', scale: '0.8 0.8 0.8' }
        ];
        
        // Elementos del DOM
        const statusElement = document.getElementById('status');
        const mainModel = document.getElementById('main-model');
        const hiroMarker = document.getElementById('hiro-marker');
        
        // Eventos del marcador
        hiroMarker.addEventListener('markerFound', function() {
            console.log('🎯 Marcador HIRO detectado!');
            statusElement.textContent = '✅ Marcador detectado - ¡AR activo!';
            statusElement.className = 'status detected';
            
            // Reproducir sonido de detección
            const detectionSound = document.getElementById('detection-sound');
            if (detectionSound) {
                detectionSound.play().catch(e => console.log('Audio no disponible:', e));
            }
            
            // Efecto visual
            mainModel.setAttribute('scale', '1.2 1.2 1.2');
            setTimeout(() => {
                mainModel.setAttribute('scale', '1 1 1');
            }, 500);
        });
        
        hiroMarker.addEventListener('markerLost', function() {
            console.log('❌ Marcador HIRO perdido');
            statusElement.textContent = '🔍 Buscando marcador...';
            statusElement.className = 'status searching';
        });
        
        // Funciones de control
        function toggleAnimation() {
            animationEnabled = !animationEnabled;
            if (animationEnabled) {
                mainModel.setAttribute('animation', 'property: rotation; to: 0 360 0; loop: true; dur: 3000');
                console.log('🔄 Animación activada');
            } else {
                mainModel.removeAttribute('animation');
                console.log('⏸️ Animación pausada');
            }
        }
        
        function changeModel() {
            currentModel = (currentModel + 1) % models.length;
            const model = models[currentModel];
            
            // Cambiar el tipo de geometría
            mainModel.setAttribute('geometry', `primitive: ${model.type}`);
            mainModel.setAttribute('material', `color: ${model.color}; metalness: 0.8; roughness: 0.2`);
            mainModel.setAttribute('scale', model.scale);
            
            console.log(`🎲 Modelo cambiado a: ${model.type}`);
            
            // Efecto visual
            mainModel.setAttribute('scale', '1.3 1.3 1.3');
            setTimeout(() => {
                mainModel.setAttribute('scale', model.scale);
            }, 300);
        }
        
        function playSound() {
            const hoverSound = document.getElementById('hover-sound');
            if (hoverSound) {
                hoverSound.play().catch(e => console.log('Audio no disponible:', e));
                console.log('🔊 Sonido reproducido');
            }
        }
        
        // Eventos de clic en el modelo
        mainModel.addEventListener('click', function() {
            console.log('👆 Modelo clickeado!');
            playSound();
            
            // Efecto de rotación rápida
            mainModel.setAttribute('animation', 'property: rotation; to: 0 720 0; loop: false; dur: 1000');
            setTimeout(() => {
                if (animationEnabled) {
                    mainModel.setAttribute('animation', 'property: rotation; to: 0 360 0; loop: true; dur: 3000');
                }
            }, 1000);
        });
        
        // Inicialización
        document.addEventListener('DOMContentLoaded', function() {
            console.log('🚀 AR.js Taller inicializado');
            console.log('📱 Usando marcador HIRO estándar');
            console.log('🎮 Controles disponibles:');
            console.log('  - Toggle Animación: Activa/desactiva rotación');
            console.log('  - Cambiar Modelo: Cicla entre geometrías');
            console.log('  - Sonido: Reproduce audio de interacción');
        });
        
        // Manejo de errores de cámara
        window.addEventListener('error', function(e) {
            if (e.message.includes('camera')) {
                statusElement.textContent = '❌ Error: Acceso a cámara denegado';
                statusElement.style.background = 'rgba(255, 0, 0, 0.3)';
                statusElement.style.color = '#ff0000';
            }
        });
    </script>
</body>
</html>
